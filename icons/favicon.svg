<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="aiPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" />

  <!-- Cyber Grid Circuit Lines -->
  <path d="M120 256 H200 M312 256 H392 M256 120 V200 M256 312 V392" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <circle cx="120" cy="256" r="8" fill="#38bdf8" />
  <circle cx="392" cy="256" r="8" fill="#38bdf8" />
  <circle cx="256" cy="120" r="8" fill="#38bdf8" />
  <circle cx="256" cy="392" r="8" fill="#38bdf8" />

  <!-- Outer Glowing Hexagon / Shield -->
  <path d="M256 140 L356 198 V314 L256 372 L156 314 V198 Z" stroke="url(#neonCyan)" stroke-width="10" fill="rgba(15, 23, 42, 0.7)" filter="url(#glow)" />

  <!-- AI Neural Brain / Core Spark -->
  <path d="M256 195 L308 256 L256 317 L204 256 Z" fill="url(#aiPurple)" />
  <circle cx="256" cy="256" r="22" fill="#ffffff" />
  <circle cx="256" cy="256" r="12" fill="#06b6d4" />

  <!-- Orbiting Nodes -->
  <circle cx="256" cy="195" r="7" fill="#ffffff" />
  <circle cx="308" cy="256" r="7" fill="#ffffff" />
  <circle cx="256" cy="317" r="7" fill="#ffffff" />
  <circle cx="204" cy="256" r="7" fill="#ffffff" />
</svg>
